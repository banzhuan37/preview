<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081f2b" />
    <meta name="description" content="BioVision 果蝇 AI 预测跟踪与行为分析网页演示" />
    <title>BioVision</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === "file:") {
        document.getElementById("root").innerHTML = `
          <main style="min-height:100vh;display:grid;place-items:center;padding:32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#17323b;background:#eef4f4">
            <section style="max-width:560px;padding:32px;border:1px solid #d6e3e3;border-radius:16px;background:#fff;box-shadow:0 18px 50px rgba(8,48,58,.12);text-align:center">
              <div style="width:54px;height:54px;display:grid;place-items:center;margin:0 auto 16px;border-radius:15px;color:#fff;background:linear-gradient(145deg,#0c3b48,#0b9189);font-size:24px">◎</div>
              <h1 style="margin:0;font-size:24px">请使用本地预览启动器</h1>
              <p style="margin:12px 0 0;color:#688087;line-height:1.7">BioVision 现在使用 React 页面，不能直接双击 index.html 加载。macOS 请双击“启动本地预览.command”，Windows 请双击“启动原型.bat”。</p>
            </section>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
